name: 多持仓策略报告 V3.0

  on:
    schedule:
      # 每周一到周五早晨8:30运行（UTC时间0:30）
      - cron: '30 0 * * 1-5'
    workflow_dispatch:  # 允许手动触发

  jobs:
    multi_position_report:
      runs-on: ubuntu-latest

      steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 运行多持仓策略分析
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python cloud_fund_advisor_v3_multi.py

      - name: 等待5秒（确保消息发送）
        run: sleep 5
