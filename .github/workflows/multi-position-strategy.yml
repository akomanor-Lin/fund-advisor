name: 多持仓策略报告 V5.0

on:
  schedule:
    # 每天收盘后运行（北京时间15:30，UTC时间7:30）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  position-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout代码
      uses: actions/checkout@v3

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests akshare tushare

    - name: 运行多持仓策略报告 V5.0
      env:
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: |
        python cloud_fund_advisor_v5_multi.py

    - name: 等待5秒（确保消息发送）
      run: sleep 5
