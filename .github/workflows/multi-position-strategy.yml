name: Multi-Position Strategy V3.0

  on:
    schedule:
      # Run at 8:30 AM Beijing time (0:30 UTC), Monday to Friday
      - cron: '30 0 * * 1-5'
    workflow_dispatch:  # Allow manual trigger

  jobs:
    multi_position_report:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run multi-position strategy analysis
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python cloud_fund_advisor_v3_multi.py

      - name: Wait for message delivery
        run: sleep 5
